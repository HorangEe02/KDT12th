# ============================================================================
# Firebase App Hosting — Phase 6 Next.js 16 배포 설정
# ----------------------------------------------------------------------------
# 배포 커맨드:
#   firebase apphosting:secrets:set GEMINI_API_KEY --project mini12-310f5
#   firebase apphosting:secrets:set KAKAO_REST_API_KEY --project mini12-310f5
#   firebase apphosting:secrets:set WEATHER_API_KEY_ENCODED --project mini12-310f5
#   firebase apphosting:secrets:set TOUR_API_KEY_ENCODED --project mini12-310f5
#
# 상세: docs/SESSION_F_DEPLOY_RUNBOOK.md
# ============================================================================

runConfig:
  # Cloud Run 인스턴스 설정 (Serverless — 유휴 시 자동 0으로)
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  timeoutSeconds: 120

env:
  # -------- 공개 Firebase 프로젝트 정보 (BUILD 시 클라이언트 번들에도 주입) --------
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: mini12-310f5
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: mini12-310f5.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: mini12-310f5.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # -------- 서버 전용 --------
  - variable: FIREBASE_PROJECT_ID
    value: mini12-310f5
    availability:
      - RUNTIME

  # 2026-04-20: Gemini 3.1 Flash Lite (preview) 재전환
  # 이유: 2.5 Flash Lite의 무료 티어 RPD 20회가 너무 작아 일일 한도 초과 빈번.
  # 3.1 Flash Lite Preview는 RPD 500회로 25배 여유.
  # 안전망: Pre-flight fallback (app/api/chat/route.ts 의 selectWorkingModel) 이
  # primary 모델명에 "preview" 포함 시 자동으로 fallback 모델로 전환.
  - variable: GEMINI_CHAT_MODEL
    value: gemini-3.1-flash-lite-preview
    availability:
      - RUNTIME

  - variable: GEMINI_FALLBACK_MODEL
    value: gemini-flash-latest
    availability:
      - RUNTIME

  # -------- 필수 시크릿 (Secret Manager — `firebase apphosting:secrets:set NAME`) --------
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: KAKAO_REST_API_KEY
    secret: KAKAO_REST_API_KEY
    availability:
      - RUNTIME

  - variable: WEATHER_API_KEY_ENCODED
    secret: WEATHER_API_KEY_ENCODED
    availability:
      - RUNTIME

  - variable: TOUR_API_KEY_ENCODED
    secret: TOUR_API_KEY_ENCODED
    availability:
      - RUNTIME

  # -------- 선택 시크릿 (비활성화됨) --------
  # Kakao 모빌리티 키 미등록 → 길찾기는 OSRM(OSM) 폴백으로 동작
  # Firebase Web SDK 키 미등록 → Badges/Share 는 localStorage / URL 쿼리로 동작
  #
  # === Firebase Web SDK (Auth + Firestore + Storage) ===
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]

  # === 세션 쿠키 설정 (서버) ===
  - variable: SESSION_COOKIE_NAME
    value: __session
    availability: [RUNTIME]
  - variable: SESSION_COOKIE_DAYS
    value: "5"
    availability: [RUNTIME]

  # === 선택 시크릿 (비활성화됨) ===
  # Kakao 모빌리티 키 미등록 → 길찾기는 OSRM(OSM) 폴백으로 동작
  # - variable: KAKAO_MOBILITY_API_KEY
  #   secret: KAKAO_MOBILITY_API_KEY
  #   availability: [RUNTIME]
