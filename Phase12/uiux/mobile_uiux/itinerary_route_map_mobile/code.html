<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .map-bg {
            background-color: #e5e5e5;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .backdrop-blur-xl {
            backdrop-filter: blur(24px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body overflow-hidden h-screen w-screen relative">

<path d="M 150 250 Q 200 350 120 450 T 250 650" fill="transparent" stroke="var(--color-primary-container)" stroke-dasharray="8 8" stroke-linecap="round" stroke-width="4"></path>
<path d="M 150 250 Q 200 350 120 450 T 250 650" fill="transparent" opacity="0.3" stroke="var(--color-primary)" stroke-dasharray="0" stroke-linecap="round" stroke-width="4"></path>
<!-- Markers -->
<!-- Hotel Marker -->
<circle cx="150" cy="250" fill="var(--color-surface-container-lowest)" r="16" stroke="var(--color-primary)" stroke-width="3"></circle>
<text fill="var(--color-primary)" font-family="'Material Symbols Outlined'" font-size="18" text-anchor="middle" x="150" y="255">hotel</text>
<!-- Restaurant Marker -->
<circle cx="120" cy="450" fill="var(--color-surface-container-lowest)" r="16" stroke="var(--color-secondary)" stroke-width="3"></circle>
<text fill="var(--color-secondary)" font-family="'Material Symbols Outlined'" font-size="18" text-anchor="middle" x="120" y="455">restaurant</text>
<!-- Stadium Marker -->
<circle cx="250" cy="650" fill="var(--color-primary)" r="20" stroke="var(--color-surface-container-lowest)" stroke-width="4"></circle>
<text fill="var(--color-on-primary)" font-family="'Material Symbols Outlined'" font-size="20" text-anchor="middle" x="250" y="656">sports_baseball</text>
</svg>
</div>
<!-- Top Navigation Shell - Web Only (Hidden on Mobile) -->
<div class="hidden md:flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl no-border bg-surface-container-low shadow-sm opacity-90 font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-[#00193c] dark:text-slate-100">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2">
<span class="material-symbols-outlined text-[#00193c] dark:text-slate-100" data-icon="menu">menu</span>
</button>
<span class="text-lg font-black tracking-tighter text-[#00193c] dark:text-white">STADIUM EDITORIAL</span>
</div>
<div class="flex items-center gap-6">
<!-- Nav links would go here for web -->

</button>
</div>
</div>
<!-- Top Action Bar (Mobile Map Overlay) -->
<div class="fixed top-0 w-full z-40 p-4 pt-12 md:hidden flex justify-between items-center pointer-events-none">
<button class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-[0_4px_24px_rgba(25,28,29,0.06)] flex items-center justify-center pointer-events-auto hover:bg-surface transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="bg-surface-container-lowest/90 backdrop-blur-md px-4 py-2 rounded-full shadow-[0_4px_24px_rgba(25,28,29,0.06)] pointer-events-auto flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="my_location">my_location</span>
<span class="font-headline font-bold text-sm tracking-tight text-primary">Seoul Itinerary</span>
</div>
<button class="w-12 h-12 bg-surface-container-lowest rounded-full shadow-[0_4px_24px_rgba(25,28,29,0.06)] flex items-center justify-center pointer-events-auto hover:bg-surface transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface" data-icon="more_vert">more_vert</span>
</button>
</div>
<!-- Journey Summary Card (Floating Bottom Overlay) -->
<div class="fixed bottom-[100px] left-0 w-full px-4 z-40 md:bottom-8 pointer-events-none">
<div class="bg-surface-container-lowest/95 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_32px_rgba(0,25,60,0.1)] p-6 pointer-events-auto relative overflow-hidden">

<div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-primary/10 to-primary-container/10 rounded-bl-full pointer-events-none"></div>
<div class="flex justify-between items-start mb-4 relative z-10">
<div>
<h2 class="font-headline font-extrabold text-xl tracking-tight text-primary">Game Day Route</h2>
<p class="font-body text-sm text-on-surface-variant mt-1">3 Stops • 45m Total Transit</p>
</div>
<div class="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="directions_bus">directions_bus</span>
<span class="font-headline font-bold text-xs uppercase tracking-wider">Optimal</span>
</div>
</div>
<!-- Stops List (No dividers) -->
<div class="flex flex-col gap-4 relative z-10">
<!-- Hotel Stop -->
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="hotel">hotel</span>
</div>
<div class="flex-1">
<p class="font-headline font-bold text-base text-on-surface">Shilla Stay Mapo</p>
<p class="font-body text-xs text-outline">Start • 2:00 PM</p>
</div>
</div>
<!-- Restaurant Stop -->
<div class="flex items-center gap-4 pl-12 relative">
<!-- Connecting line detail -->
<div class="absolute left-9 top-[-24px] bottom-[-24px] w-[2px] bg-outline-variant/30 hidden"></div>
<div class="w-8 h-8 rounded-full bg-secondary-fixed/20 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="restaurant">restaurant</span>
</div>
<div class="flex-1">
<p class="font-headline font-bold text-sm text-on-surface">Jamsil BBQ</p>
<p class="font-body text-xs text-outline">Dinner • 4:30 PM</p>
</div>
</div>
<!-- Stadium Stop -->
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shrink-0 shadow-[0_4px_12px_rgba(0,25,60,0.2)]">
<span class="material-symbols-outlined text-on-primary" data-icon="sports_baseball" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sports_baseball</span>
</div>
<div class="flex-1">
<div class="flex items-center gap-2">
<p class="font-headline font-bold text-base text-primary">Jamsil Baseball Stadium</p>
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
</div>
<p class="font-body text-xs text-primary font-semibold">First Pitch • 6:30 PM</p>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full mt-6 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold py-4 rounded-xl shadow-[0_4px_16px_rgba(0,25,60,0.15)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Start Navigation</span>
<span class="material-symbols-outlined" data-icon="navigation">navigation</span>
</button>
</div>
</div>
<!-- BottomNavBar (Mobile Only) - Using 'Map' as Active State -->
<div class="md:hidden flex justify-around items-end pb-6 pt-2 px-4 w-full fixed bottom-0 rounded-t-[2rem] z-50 bg-white dark:bg-[#00193c] no-border shadow-[0_-4px_20px_0_rgba(0,0,0,0.05)] shadow-2xl font-['Manrope'] text-[10px] font-bold uppercase tracking-widest text-[#1b6d24] dark:text-[#a3f69c]">
<!-- Matches - Inactive -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-2 hover:text-[#1b6d24] dark:hover:text-[#a3f69c] active:scale-90 duration-300 ease-out w-16">
<span class="material-symbols-outlined mb-1" data-icon="sports_baseball">sports_baseball</span>
<span>Matches</span>
</button>
<!-- Map - ACTIVE -->
<button class="flex flex-col items-center justify-center bg-[#a3f69c] dark:bg-[#1b6d24] text-[#00193c] dark:text-white rounded-full p-3 mb-1 scale-110 transition-all hover:text-[#1b6d24] dark:hover:text-[#a3f69c] active:scale-90 duration-300 ease-out w-16 shadow-[0_4px_12px_rgba(163,246,156,0.3)]">
<span class="material-symbols-outlined mb-1" data-icon="explore" data-weight="fill" style="font-variation-settings: 'FILL' 1;">explore</span>
<span>Map</span>
</button>
<!-- Stays - Inactive -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-2 hover:text-[#1b6d24] dark:hover:text-[#a3f69c] active:scale-90 duration-300 ease-out w-16">
<span class="material-symbols-outlined mb-1" data-icon="hotel">hotel</span>
<span>Stays</span>
</button>
<!-- AI - Inactive -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-2 hover:text-[#1b6d24] dark:hover:text-[#a3f69c] active:scale-90 duration-300 ease-out w-16 relative">
<div class="absolute -top-1 -right-1 w-3 h-3 bg-tertiary-fixed-dim rounded-full shadow-[0_0_8px_rgba(233,196,0,0.5)]"></div>
<span class="material-symbols-outlined mb-1" data-icon="auto_awesome">auto_awesome</span>
<span>AI</span>
</button>
<!-- Badges - Inactive -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 p-2 hover:text-[#1b6d24] dark:hover:text-[#a3f69c] active:scale-90 duration-300 ease-out w-16">
<span class="material-symbols-outlined mb-1" data-icon="military_tech">military_tech</span>
<span>Badges</span>
</button>
</div>
