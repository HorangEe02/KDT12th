<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Stadium Editorial - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffe16d",
                        "surface-container": "#edeeef",
                        "surface-container-low": "#f3f4f5",
                        "secondary-fixed-dim": "#88d982",
                        "tertiary-container": "#c9a900",
                        "surface-container-highest": "#e1e3e4",
                        "primary-fixed": "#d7e2ff",
                        "on-surface": "#191c1d",
                        "primary-container": "#002d62",
                        "on-primary-container": "#7796d1",
                        "tertiary": "#705d00",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f0f1f2",
                        "on-tertiary-fixed": "#221b00",
                        "on-tertiary-fixed-variant": "#544600",
                        "surface-dim": "#d9dadb",
                        "on-surface-variant": "#43474f",
                        "secondary-container": "#a0f399",
                        "on-tertiary-container": "#4c3f00",
                        "outline": "#747781",
                        "background": "#f8f9fa",
                        "surface-container-high": "#e7e8e9",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#e9c400",
                        "outline-variant": "#c4c6d1",
                        "on-secondary-container": "#217128",
                        "on-primary-fixed": "#001b3f",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2e3132",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "primary": "#00193c",
                        "inverse-primary": "#abc7ff",
                        "primary-fixed-dim": "#abc7ff",
                        "on-background": "#191c1d",
                        "secondary": "#1b6d24",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "on-secondary-fixed": "#002204",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#24467c",
                        "surface-bright": "#f8f9fa",
                        "surface-tint": "#3e5e95",
                        "secondary-fixed": "#a3f69c",
                        "on-secondary-fixed-variant": "#005312",
                        "surface": "#f8f9fa"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline, .font-label { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen overflow-hidden">
<!-- Main Mobile Layout Wrapper -->
<main class="relative h-[884px] w-full max-w-md mx-auto flex flex-col justify-end bg-cover bg-center overflow-hidden" data-alt="Wide scenic shot of a modern professional baseball stadium at dusk, dramatic purple and orange twilight sky, stadium lights blazing, high end editorial photography" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC0B6gQqQBJT-gkRmTey_UmsuH98np3aOuvYEp-Hah-eJDDFUQB75wLA_hkrzPxIlQd6cqRjZpGoiAl3o3BrKTQO1nhXlTvdjxUaLiyeUPmbMGiEq3SLNpLx09uwdSQBmWJoSAbYFxoMghZkG1fMTlSRCZKKrxifZ8ywoGjiEdg2UtsDRypzP91_oQkeaJU5fsA72KG2UrCckVC9FR7dv2u9LWg4VIg7dcTJ1mD3CMZQa8yvyN93VEWNoIwLoJjS1A7pz3DLbufH4U');">
<!-- Ambient Overlay for contrast -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/40 to-transparent pointer-events-none"></div>
<!-- Glassmorphic Login Container -->
<section class="relative z-10 w-full bg-surface/90 backdrop-blur-2xl rounded-t-[2.5rem] pt-10 px-8 pb-12 shadow-[0_-12px_40px_rgba(0,25,60,0.15)] flex flex-col gap-8 transform transition-transform duration-500 ease-out translate-y-0">
<!-- Header Section -->
<header class="flex flex-col gap-2">
<span class="font-label text-[10px] font-extrabold uppercase tracking-[0.2em] text-secondary">The Stadium Editorial</span>
<h1 class="font-headline text-3xl font-extrabold text-primary tracking-tight">Curate Your <br/>Matchday.</h1>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-5">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label text-xs font-bold uppercase tracking-wider text-primary ml-1">Email</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest text-on-surface font-body text-sm px-5 py-4 rounded-2xl border-none ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-secondary focus:outline-none transition-shadow placeholder:text-outline/70" placeholder="fan@stadiumeditorial.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end ml-1">
<label class="font-label text-xs font-bold uppercase tracking-wider text-primary">Password</label>
<a class="font-body text-xs font-semibold text-secondary hover:text-secondary-fixed-dim transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<input class="w-full bg-surface-container-lowest text-on-surface font-body text-sm px-5 py-4 rounded-2xl border-none ring-1 ring-outline-variant/30 focus:ring-2 focus:ring-secondary focus:outline-none transition-shadow placeholder:text-outline/70" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="mt-2 w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-2xl font-label text-sm font-extrabold uppercase tracking-[0.1em] shadow-[0_8px_24px_rgba(0,25,60,0.25)] hover:shadow-[0_12px_32px_rgba(0,25,60,0.35)] active:scale-[0.98] transition-all" type="button">
                    Sign In
                </button>
</form>
<!-- Alternative Logins -->
<div class="flex flex-col gap-5 mt-2">
<div class="flex items-center gap-4">
<div class="flex-1 h-px bg-outline-variant/40"></div>
<span class="font-label text-[10px] font-bold text-outline uppercase tracking-widest">Or Continue With</span>
<div class="flex-1 h-px bg-outline-variant/40"></div>
</div>
<div class="flex gap-4">
<!-- Kakao Auth (Simulated with generic styling matching the brand aesthetic) -->
<button class="flex-1 bg-[#FEE500]/10 hover:bg-[#FEE500]/20 text-on-surface py-3.5 rounded-2xl flex justify-center items-center gap-2 ring-1 ring-[#FEE500]/50 active:scale-[0.97] transition-all">
<div class="w-5 h-5 bg-[#FEE500] rounded-full flex items-center justify-center text-black font-extrabold text-[10px] font-headline">K</div>
<span class="font-label text-xs font-bold">Kakao</span>
</button>
<!-- Google Auth -->
<button class="flex-1 bg-surface-container-lowest hover:bg-surface-container-low text-on-surface py-3.5 rounded-2xl flex justify-center items-center gap-2 ring-1 ring-outline-variant/40 active:scale-[0.97] transition-all shadow-sm">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">account_circle</span>
<span class="font-label text-xs font-bold">Google</span>
</button>
</div>
</div>
<!-- Footer Link -->
<p class="text-center font-body text-sm text-on-surface-variant mt-4">
                Don't have an account? 
                <a class="font-headline font-bold text-primary hover:text-secondary underline decoration-2 underline-offset-4 transition-colors" href="#">Sign Up</a>
</p>
</section>
</main>
</body></html>
