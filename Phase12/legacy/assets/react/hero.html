<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "se-primary": "#00193c",
            "se-primary-container": "#002d62",
            "se-secondary": "#1b6d24",
            "se-secondary-fixed": "#a3f69c",
            "se-surface": "#f8f9fa",
            "se-surface-container-low": "#f3f4f5",
            "se-surface-container-lowest": "#ffffff",
            "se-on-surface-variant": "#43474f",
          },
          fontFamily: {
            headline: ["'Plus Jakarta Sans'", "sans-serif"],
            body: ["Manrope", "sans-serif"],
          }
        }
      }
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; font-family: 'Manrope', sans-serif; }
    .ball { display: inline-block; animation: heroBounce 2.6s ease-in-out infinite; }
    @keyframes heroBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px) rotate(12deg); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    function Hero() {
      const cfg = window.APP_CONFIG || {
        team: "LG", teamNameKo: "LG 트윈스",
        color: "#C30452", subColor: "#FFCC00",
        viewport: "web",
        teamLogo: "", kboLogo: "",
      };
      const isMobile = cfg.viewport === "mobile";
      const bg = `linear-gradient(135deg, ${cfg.color} 0%, ${cfg.subColor} 100%)`;
      const padCls = isMobile ? "p-6" : "p-10";
      const radiusCls = isMobile ? "rounded-[28px]" : "rounded-3xl";
      const titleSize = isMobile ? "text-[1.9rem]" : "text-[2.6rem]";
      const logoSize = isMobile ? "w-[80px] h-[80px]" : "w-[96px] h-[96px]";
      const innerLogoSize = isMobile ? "w-[60px] h-[60px]" : "w-[72px] h-[72px]";

      return (
        <div
          className={`relative overflow-hidden shadow-[0_12px_32px_rgba(0,0,0,0.18)] text-white ${radiusCls} ${padCls}`}
          style={{ background: bg }}
        >
          {cfg.kboLogo && (
            <img
              src={cfg.kboLogo}
              alt="KBO"
              className="absolute top-4 right-4 w-14 h-14 opacity-25 pointer-events-none"
              style={{ filter: "brightness(0) invert(1)" }}
            />
          )}
          <div className="absolute inset-0 pointer-events-none"
               style={{ background: "radial-gradient(circle at 85% 30%, rgba(255,255,255,0.22), transparent 55%)" }} />
          <div className={`relative z-10 flex ${isMobile ? 'flex-col items-start gap-5' : 'items-center justify-between gap-8'}`}>
            <div className="flex-1">
              <span className="inline-block px-3.5 py-1.5 rounded-full bg-white/20 backdrop-blur-sm font-headline font-bold text-[0.7rem] uppercase tracking-[0.16em] mb-3">
                KBO 2026 · Away Companion
              </span>
              <h1 className={`font-headline font-extrabold leading-[1.1] tracking-tight drop-shadow-[0_2px_14px_rgba(0,0,0,0.28)] mb-2 ${titleSize}`}>
                <span className="ball">⚾</span> 원정 응원 플래너
              </h1>
              <p className="font-body text-white/92 text-base">
                팀 선택 한 번으로 티켓·교통·맛집·숙소·관광을 한 번에
              </p>
            </div>
            <div className={`flex items-center gap-4 ${isMobile ? 'self-end' : ''}`}>
              <div className={isMobile ? 'text-left' : 'text-right'}>
                <div className="font-headline font-bold text-[1.5rem] drop-shadow">{cfg.teamNameKo}</div>
                <div className="text-white/85 text-sm mt-1">선택 팀 컬러 테마</div>
              </div>
              {cfg.teamLogo && (
                <div className={`${logoSize} rounded-full bg-white/95 flex items-center justify-center shadow-2xl ring-4 ring-white/30`}>
                  <img src={cfg.teamLogo} alt={cfg.team} className={`${innerLogoSize} object-contain`} />
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Hero />);
  </script>
</body>
</html>
