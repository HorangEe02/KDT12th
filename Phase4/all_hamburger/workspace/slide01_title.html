<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #2C2C2C; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; top: 0; left: 0; width: 100%; height: 8pt;
  background: #E07A5F;
}
.title-box {
  text-align: center; padding: 30pt;
}
h1 {
  color: #F4F1DE; font-size: 36pt; margin: 0 0 15pt 0; font-weight: bold;
  line-height: 1.3;
}
.subtitle {
  color: #87A96B; font-size: 18pt; margin: 0 0 30pt 0;
}
.info {
  color: #AAAAAA; font-size: 12pt; margin: 0;
}
.bottom-bar {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 4pt;
  background: #87A96B;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="title-box">
  <h1>기후변화가 햄버거 재료에<br>미치는 영향 분석</h1>
  <p class="subtitle">FAOSTAT &amp; Kaggle 공공데이터 기반 통계 분석</p>
  <p class="info">KNU 공공데이터 미니프로젝트 | 2024</p>
</div>
<div class="bottom-bar"></div>
</body>
</html>
