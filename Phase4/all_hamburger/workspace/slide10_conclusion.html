<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #2C2C2C; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #E07A5F; padding: 20pt 30pt;
}
.header h1 {
  color: #FFFFFF; font-size: 24pt; margin: 0; font-weight: bold;
}
.content {
  padding: 25pt 30pt; flex: 1;
}
h2 {
  color: #87A96B; font-size: 18pt; margin: 0 0 20pt 0; font-weight: bold;
}
.findings {
  display: flex; gap: 15pt; margin-bottom: 20pt;
}
.finding {
  flex: 1; background: #3D3D3D; padding: 15pt; border-radius: 6pt;
  border-top: 4pt solid #87A96B;
}
.finding h3 {
  color: #E07A5F; font-size: 20pt; margin: 0 0 6pt 0; font-weight: bold;
}
.finding p {
  color: #F4F1DE; font-size: 11pt; margin: 0; line-height: 1.4;
}
.message {
  background: #87A96B; padding: 20pt; border-radius: 6pt; text-align: center;
}
.message p {
  color: #FFFFFF; font-size: 16pt; margin: 0; font-style: italic;
}
</style>
</head>
<body>
<div class="header">
  <h1>최종 결론</h1>
</div>
<div class="content">
  <h2>핵심 발견 요약</h2>
  <div class="findings">
    <div class="finding">
      <h3>r > 0.5</h3>
      <p>모든 품목에서 기온-생산량 유의미한 상관관계</p>
    </div>
    <div class="finding">
      <h3>+0.84°C</h3>
      <p>30년간 글로벌 기온 상승 (파리협정 1.5°C 근접)</p>
    </div>
    <div class="finding">
      <h3>-2~5%</h3>
      <p>이상기후 시 단기 생산량 감소</p>
    </div>
    <div class="finding">
      <h3>+65%</h3>
      <p>한국 밀 수입량 증가 (23년간)</p>
    </div>
  </div>
  <div class="message">
    <p>"기후변화는 먼 미래의 이야기가 아니라, 오늘 점심 메뉴에 영향을 미치는 현실이다."</p>
  </div>
</div>
</body>
</html>
