[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_torch: marks tests that need torch installed
    requires_transformers: marks tests that need transformers installed
    requires_sbert: marks tests that need sentence-transformers installed
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
