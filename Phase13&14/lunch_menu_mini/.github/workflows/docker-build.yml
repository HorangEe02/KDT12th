# =============================================================================
# Mini — Docker build + push to GHCR
# =============================================================================
# On every push to `main` and every tag, build the 3 Mini images and push
# them to GitHub Container Registry (ghcr.io).
#
# Images:
#   - ghcr.io/<owner>/mini-lunch-optimizer
#   - ghcr.io/<owner>/mini-nlp-api
#   - ghcr.io/<owner>/mini-dashboard-web
#
# Tags:
#   - `latest`                 (branch=main only)
#   - `sha-<7char>`            (every build)
#   - `v1.2.3`                 (on git tag push)
#   - `1.2`, `1`               (major / minor from tag)
#
# PRs trigger a dry-run build (`push: false`) to catch Dockerfile regressions
# without publishing.
# =============================================================================
name: docker-build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "lunch-optimizer/**"
      - "NLP/**"
      - "dashboard-web/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "lunch-optimizer/**"
      - "NLP/**"
      - "dashboard-web/**"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        type: boolean
        default: false

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Derive the image namespace from the repo (e.g. `octocat/mini`)
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: lunch-optimizer
            dockerfile: docker/Dockerfile.lunch
            image_suffix: mini-lunch-optimizer
          - service: nlp-api
            dockerfile: docker/Dockerfile.nlp
            image_suffix: mini-nlp-api
          - service: dashboard-web
            dockerfile: docker/Dockerfile.web
            image_suffix: mini-dashboard-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Mini ${{ matrix.service }}
            org.opencontainers.image.description=Mini Lunch Optimizer — ${{ matrix.service }}
            org.opencontainers.image.vendor=Mini

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_LUNCH_API=http://localhost:8000/api
            NEXT_PUBLIC_NLP_API=http://localhost:8001
            NEXT_PUBLIC_DEFAULT_USER_ID=1

      - name: Image digest summary
        run: |
          echo "## ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────────────────────
  compose-validate:
    name: docker-compose config validation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml is valid"
