# =============================================================================
# Mini — Next.js dashboard CI
# =============================================================================
# Type-check, lint, and production build for the dashboard-web/ package.
# Uses Node 20 + npm ci with a cached node_modules directory.
# =============================================================================
name: web-ci

on:
  push:
    branches: [main]
    paths:
      - "dashboard-web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "dashboard-web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js 16 build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard-web/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0
        continue-on-error: false

      - name: Build (standalone output)
        run: npm run build
        env:
          # Ensure the bundle keeps the default localhost URLs for CI smoke
          NEXT_PUBLIC_LUNCH_API: http://localhost:8000/api
          NEXT_PUBLIC_NLP_API: http://localhost:8001
          NEXT_PUBLIC_DEFAULT_USER_ID: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Check standalone output exists
        run: |
          test -f .next/standalone/server.js || {
            echo "::error::Standalone output missing. Check next.config.ts."
            exit 1
          }

      - name: Upload build stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-stats
          path: |
            dashboard-web/.next/build-manifest.json
            dashboard-web/.next/app-build-manifest.json
          retention-days: 7
          if-no-files-found: ignore
